name: AegisScan Security Assessment

on:
  workflow_dispatch:
  pull_request:

jobs:
  aegisscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AegisScan
        run: pip install -r backend/requirements.txt
      # Start the authorized test application before this step when required.
      # Set AEGISSCAN_TARGET_URL in repository/environment variables.
      - name: Run AegisScan policy
        working-directory: backend
        env:
          AEGISSCAN_TARGET_URL: ${{ vars.AEGISSCAN_TARGET_URL }}
        run: >-
          python -m app ci
          --target "$AEGISSCAN_TARGET_URL"
          --policy ../security-policy.example.yaml
          --format json,sarif,html
          --output ../artifacts
      - name: Upload AegisScan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisscan-artifacts
          path: artifacts/
